<!DOCTYPE html>
<html lang="ca">
  <head>
    <meta charset="UTF-8">
    <title>El menú del menjador</title>
    <link rel="stylesheet" href="estils.css">
  </head>
  <body>
    <main>
      <h1>El menú del menjador</h1>
      <p>Aquesta setmana, a l'institut, mengem això:</p>
      <table>
        <caption>Menú de la setmana</caption>
        <thead>
          <tr>
            <th scope="col">Dia</th>
            <th scope="col">Primer plat</th>
            <th scope="col">Segon plat</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row">Dilluns</th>
            <td>Macarrons amb tomàquet</td>
            <td>Truita de patates</td>
          </tr>
          <tr>
            <th scope="row">Dimarts</th>
            <td>Crema de carbassa</td>
            <td>Pollastre a la planxa</td>
          </tr>
          <tr>
            <th scope="row">Dimecres</th>
            <td>Llenties</td>
            <td>Lluç arrebossat</td>
          </tr>
        </tbody>
      </table>
    </main>
  </body>
</html>
